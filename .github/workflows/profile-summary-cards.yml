# Once a day: rebuilds the profile stats cards (profile-summary-card-output/), then refreshes the
# "Latest writing" list from nuque.dev/rss.xml. Card images live in the repo,
# so the README never depends on a third-party image service being up.
# Uses the repo's own GITHUB_TOKEN: public activity only, no personal token needed.
name: Profile cards and latest writing

on:
  schedule:
    - cron: "17 21 * * *" # daily, 05:17 Manila time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@7022eb6bd48de38b092f54110a8ff8185f2ac4a1 # v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
          THEME: transparent
          NAME: Angelo Julius Nuque

  writing:
    # Runs after the cards job (its own fresh checkout), so the two never push at the same time.
    needs: cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://nuque.dev/rss.xml"
          max_post_count: 5
          template: "- [$title]($url), $date $newline"
          date_format: "d mmm yyyy"
          enable_keepalive: false
          tag_post_pre_newline: true
          disable_html_encoding: true
          committer_username: "Angelo Julius Nuque"
          commit_message: "Update latest writing from nuque.dev"
